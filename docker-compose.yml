services:
  stock-bot:
    build:
      context: .
      args:
        # Set by scripts/update.sh, so the bot knows its own version (for update DMs).
        GIT_SHA: ${GIT_SHA:-}
    image: tracker-network-stock:latest
    container_name: tracker-network-stock
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRACKER_DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
    volumes:
      - stock-bot-data:/data
    # Hardening: the app only needs to write /data; everything else is read-only.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Healthy while the bot is connected to Discord and its database answers: it touches
    # /tmp/flipscout-heartbeat every 20s (tracker/heartbeat.py). scripts/update.sh waits for
    # this after an update and rolls back if it never comes.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/flipscout-heartbeat') > 90)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s

volumes:
  stock-bot-data:
