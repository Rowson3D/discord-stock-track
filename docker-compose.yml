services:
  stock-bot:
    build: .
    image: tracker-network-stock:latest
    container_name: tracker-network-stock
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRACKER_DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
    volumes:
      - stock-bot-data:/data
    # Hardening: the app only needs to write /data; everything else is read-only.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/data/tracker.db').execute('select 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  stock-bot-data:
