[project]
name = "tracker-network-stock"
version = "0.3.0"
description = "UniFi resale intelligence: retail stock, launch radar, resale margins, and alerts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "beautifulsoup4>=4.12",
    "discord.py>=2.4",
    "fastapi>=0.115",
    "httpx[http2]>=0.27",
    "lxml>=5.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.7",
    "segno>=1.6",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Browser automation for guarded add-to-cart (Phase 6).
checkout = ["playwright>=1.47"]

[project.scripts]
tracker = "tracker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to sit in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tracker/db/migrations/versions/*" = ["E501"]
