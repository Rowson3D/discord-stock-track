[project]
name = "tracker-network-stock"
version = "0.2.0"
description = "UniFi resale intelligence: retail stock, launch radar, resale margins, and alerts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "discord.py>=2.4",
    "httpx[http2]>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
]

[project.optional-dependencies]
# Browser automation for guarded add-to-cart (Phase 6) and the legacy bot.
checkout = ["playwright>=1.47"]
# Dependencies of the legacy bot (bot.py / monitor.py / scrapers.py) until it is retired.
legacy = [
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.47",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "requests>=2.31",
]

[project.scripts]
tracker = "tracker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Legacy bot files are retired in Phase 2; don't lint them.
extend-exclude = ["bot.py", "monitor.py", "scrapers.py", "checkout.py", "config.py", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tracker/db/migrations/versions/*" = ["E501"]
