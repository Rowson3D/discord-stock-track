# Alembic CLI config. The app migrates itself programmatically (tracker.db.migrate);
# this file is for developers: `uv run alembic revision --autogenerate -m "..."`.
# The database URL comes from TRACKER_DATABASE_URL / TRACKER_DATA_DIR via tracker.settings.

[alembic]
script_location = tracker/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
